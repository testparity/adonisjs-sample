settings:
  namespace_roots:
    app: App
    tests: Tests
  source_extension: ".ts"
  test_suffix: ".spec"
  test_extension: ".ts"
  namespace_separator: "."

coverage_xml: .parity/per-test
min_coverage: 70
min_coverage_global: 80
min_matched_coverage: 40

test:
  command: "./node_modules/.bin/c8 --include='app/services/**/*.ts' --reporter=clover --reports-dir=$(dirname {coverage}) node ace test unit --files={test}"
  coverage: ".parity/tmp/{slug}/clover.xml"
  reports: ".parity/per-test"
  timeout: 300

structure:
  - name: "AdonisJS Services"
    paths:
      source: "app/services"
      test: "tests/unit/services"
    rules:
      - minimum-coverage:
          min: 70
      - matched-coverage:
          min: 40
